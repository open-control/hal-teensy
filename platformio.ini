; Open Control - Teensy HAL Drivers

[platformio]
default_envs = dev

; ============================================================================
; Common settings shared by all environments
; ============================================================================
[env]
platform = teensy
board = teensy41
framework = arduino
build_flags = -std=gnu++17 -I src -D USB_MIDI_SERIAL

; ============================================================================
; Development: uses local repos via symlink (requires repos in ../)
; Usage: pio run -e dev
; ============================================================================
[env:dev]
lib_deps =
    framework=symlink://../framework
    hal-common=symlink://../hal-common
    https://github.com/luni64/EncoderTool
    vindar/ILI9341_T4@1.7.0
    https://github.com/PaulStoffregen/Encoder

[env:sd_fs_smoke]
extends = env:dev
board_build.f_cpu = 450000000L
build_flags = ${env.build_flags}
    -D OC_HAL_TEENSY_SD_FILESYSTEM_SMOKE

; ============================================================================
; Release: uses GitHub repos (standalone, no local deps required)
; Usage: pio run -e release
; ============================================================================
[env:release]
lib_deps =
    oc-framework=https://github.com/open-control/framework.git#3b8a182422bb1183e5930da0eeb53e584a570dbb
    oc-hal-common=https://github.com/open-control/hal-common.git#e3aa784055554922d130bba8065422d11a7dcd02
    https://github.com/luni64/EncoderTool
    vindar/ILI9341_T4@1.7.0
    https://github.com/PaulStoffregen/Encoder
